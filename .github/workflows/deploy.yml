name: deploy-lexi-core
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lexi-production
  cancel-in-progress: false
jobs:
  core:
    # Remains safely disabled until the owner explicitly configures Core HA and
    # the SSH secrets; a contributor PR NEVER receives deployment credentials.
    if: vars.LEXI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Local structural and isolated HTTP tests
        run: |
          python3 tests/test_community_content.py
          python3 tests/test_content_guard.py
          python3 qa_pedagogy_upgrade.py
          python3 tests/test_selfhost.py
      - name: Pack immutable main commit
        run: |
          git archive --format=tar HEAD | gzip -n > "lexi-$GITHUB_SHA.tar.gz"
          sha256sum "lexi-$GITHUB_SHA.tar.gz" > bundle.sha256
      - name: Establish pinned SSH transport
        env:
          DEPLOY_KEY: ${{ secrets.LEXI_DEPLOY_SSH_KEY }}
          HOST_KEYS: ${{ secrets.LEXI_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEYS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Ship reviewed artifact and deploy
        env:
          HOST: ${{ vars.LEXI_DEPLOY_HOST }}
          USER: ${{ vars.LEXI_DEPLOY_USER }}
        run: |
          test -n "$HOST" && test -n "$USER"
          sha="$(cut -d' ' -f1 bundle.sha256)"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "lexi-$GITHUB_SHA.tar.gz" "$USER@$HOST:/var/lib/lexi-deploy/incoming/lexi-$GITHUB_SHA.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$USER@$HOST" \
            "sudo -n /usr/local/sbin/lexi-core-deploy '$GITHUB_SHA' '$sha'"
