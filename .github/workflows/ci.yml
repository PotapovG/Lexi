name: smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  selfhost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import, isolated HTTP and HTTP origin tests
        run: python3 tests/test_selfhost.py
      - name: Community content uniqueness, lesson grammar and translations
        run: python3 tests/test_community_content.py
      - name: Noun gender grammar and isolated scoring QA
        run: |
          python3 qa_grammar2.py
          python3 qa_grammar2_http.py
          python3 qa_possessives.py
          python3 qa_verb_a_present.py
          python3 qa_verb_b1_present.py
          python3 qa_verb_b2_present.py
          python3 qa_likes_dislikes.py
          python3 qa_week_agenda.py
          python3 qa_duration.py
          python3 qa_weather.py
          python3 qa_core_verbs.py
          node --check app.js
      - name: A1 dialogue expansion and legacy dialogue integrity
        run: |
          python3 qa_a1_dialogue_expansion.py
          python3 qa_dialogues_100.py
          python3 qa_dialogue_curated.py
          python3 qa_dialogue_full_and_options.py
      - name: Early-level progression audit
        run: python3 qa_pedagogy_upgrade.py
      - name: Originality regression guard (without private textbook)
        run: python3 tests/test_content_guard.py
      - name: Validate guarded Core GitOps scripts
        run: |
          bash -n ops/lexi-core-deploy.sh ops/lexi-gitops-pull.sh
          sh -n ops/lexi-instance.sh
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build container
        run: docker compose build
